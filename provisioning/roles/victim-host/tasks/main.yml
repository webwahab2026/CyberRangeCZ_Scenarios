---
- name: Add host aliases
  lineinfile:
    path: /etc/hosts
    line: "{{ item.ip }} {{ item.name }}"
    state: present
  loop: "{{ hosts_entries }}"

- name: Add victim user
  user:
    name: '{{ username }}'
    password: '{{ password | password_hash("sha512") }}'
    shell: /bin/bash
    state: present

- name: Install packages
  apt:
    name: "{{ packages_to_install }}"
    state: present
    update_cache: yes

- name: Create dropped session directory
  file:
    path: /tmp/.session
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Create decoy work files
  copy:
    dest: "/home/{{ username }}/{{ item.name }}"
    content: "{{ item.content }}"
    owner: "{{ username }}"
    mode: "0644"
  loop:
    - name: invoice_march.txt
      content: |
        INVOICE #INV-2026-0312
        From: DocuSign Automated Delivery
        Please review and sign the attached document.
        Use the internal PDF viewer to open: invoice_march.pdf
        Download viewer: http://staging-server:7070/viewpdf.sh
    - name: meeting_notes.txt
      content: |
        Meeting notes 2026-03-10 — Internal
        Action items:
        - Review Q1 financials (see invoice_march.pdf)
        - Update DB credentials before EOW
        - Confirm server migration timeline
