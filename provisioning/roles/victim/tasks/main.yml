---
- name: Add host aliases
  lineinfile:
    path: '/etc/hosts'
    line: "{{ item.ip }} {{ item.name }}"
    state: present
  loop: "{{ hosts_entries }}"

- name: Add victim user
  user:
    name: '{{ username }}'
    password: '{{ password | password_hash("sha512") }}'
    shell: '/bin/bash'
    state: present

- name: Install packages
  apt:
    name: "{{ packages_to_install }}"
    state: present
    update_cache: yes

- name: Copy decoy documents
  copy:
    src: "{{ item }}"
    dest: "/home/{{ username }}/{{ item }}"
    owner: "{{ username }}"
    mode: "0644"
  loop: "{{ files_to_copy }}"

- name: Create Payloads
  copy:
      dest: "/home/{{ username }}/{{ item.name }}"
      content: "{{ item.content }}"
      owner: "{{ username }}"
      mode: "0644"
  loop: "{{ files_to_create }}"


