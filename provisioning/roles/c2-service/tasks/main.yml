---
- name: Install netcat
  apt:
    name: netcat-openbsd
    state: present
    update_cache: yes

- name: Ensure client user exists
  user:
    name: "{{ client_user }}"
    shell: /bin/bash
    state: present

- name: Create periodic check-in script
  copy:
    dest: "{{ connect_script_path }}"
    owner: root
    group: root
    mode: "0755"
    content: |
      #!/bin/bash
      sleep $((RANDOM % {{ ((random_delay_seconds | default(0) | int) + 1) }}))
      OUTPUT_FILE="{{ connect_output_path | default('/home/' ~ client_user ~ '/connect_data.log') }}"
      RESPONSE=$(printf "%s\n" {{ connect_message | quote }} | nc -w 5 {{ connect_host | quote }} {{ connect_port | int }} 2>/dev/null)
      if [ -n "$RESPONSE" ]; then
        echo "---- $(date) ----" >> "$OUTPUT_FILE"
        echo "$RESPONSE" >> "$OUTPUT_FILE"
      fi

- name: Create systemd service
  copy:
    dest: "/etc/systemd/system/{{ connect_service_unit }}"
    owner: root
    group: root
    mode: "0644"
    content: |
      [Unit]
      Description=Lab periodic outbound check-in
      After=network-online.target
      Wants=network-online.target
      [Service]
      Type=oneshot
      ExecStart={{ connect_script_path }}
      [Install]
      WantedBy=multi-user.target

- name: Create systemd timer
  copy:
    dest: "/etc/systemd/system/{{ connect_timer_unit }}"
    owner: root
    group: root
    mode: "0644"
    content: |
      [Unit]
      Description=Run lab periodic outbound check-in
      [Timer]
      OnCalendar={{ connect_schedule }}
      Persistent=true
      [Install]
      WantedBy=timers.target

- name: Enable and start timer
  systemd:
    name: "{{ connect_timer_unit }}"
    enabled: yes
    state: started
    daemon_reload: yes

- name: Create BRICKSTORM C2 communication script
  copy:
    dest: "/usr/local/bin/brickstorm-c2.sh"
    owner: root
    group: root
    mode: "0755"
    content: |
      #!/bin/bash
      # Simulate BRICKSTORM C2 communication
      
      # Simulate DoH resolution
      echo "[BRICKSTORM] Resolving C2 domain via DoH"
      
      # Simulate HTTPS connection to C2 server
      echo "[BRICKSTORM] Connecting to C2 server https://[redacted].com"
      
      # Simulate WebSocket upgrade
      echo "[BRICKSTORM] Upgrading to WebSocket wss://[redacted].com/cls"
      
      # Simulate authentication with key
      echo "[BRICKSTORM] Authenticating with key hkigbLKHR_Pby6t6P"
      
      # Simulate command execution
      echo "[BRICKSTORM] Executing C2 commands"
      
      # Simulate data exfiltration
      echo "[BRICKSTORM] Exfiltrating data"
      
      # Simulate lateral movement
      echo "[BRICKSTORM] Initiating lateral movement"

- name: Create systemd service for BRICKSTORM C2
  copy:
    dest: "/etc/systemd/system/brickstorm-c2.service"
    owner: root
    group: root
    mode: "0644"
    content: |
      [Unit]
      Description=BRICKSTORM C2 Communication
      After=network-online.target
      Wants=network-online.target
      [Service]
      Type=oneshot
      ExecStart=/usr/local/bin/brickstorm-c2.sh
      [Install]
      WantedBy=multi-user.target

- name: Create systemd timer for BRICKSTORM C2
  copy:
    dest: "/etc/systemd/system/brickstorm-c2.timer"
    owner: root
    group: root
    mode: "0644"
    content: |
      [Unit]
      Description=Run BRICKSTORM C2 communication
      [Timer]
      OnCalendar=*:0/10
      Persistent=true
      [Install]
      WantedBy=timers.target

- name: Enable and start BRICKSTORM C2 timer
  systemd:
    name: brickstorm-c2.timer
    enabled: yes
    state: started
    daemon_reload: yes
