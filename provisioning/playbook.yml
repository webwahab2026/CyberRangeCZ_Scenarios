---
- name: disable qxl
  hosts:
    - routers
    - hosts
  gather_facts: yes
  become: yes
  tasks:
    - include_role:
        name: disable-qxl
      when: ansible_os_family == 'Debian'


- name: set up victim
  hosts: victim
  become: yes
  roles:
    - name: victim-host
    - name: user-access
      user_access_username: cyrano
      user_access_password: cyrano
      user_access_sudo: False

- name: set up staging-server
  hosts: staging-server
  become: yes
  roles:
    - name: staging-server

- name: set up c2-server
  hosts: c2-server
  become: yes
  roles:
    - name: c2-server


- name: Simulate dropper execution on victim
  hosts: victim
  become: yes
  roles:
    - role: dropper-execute
      vars:
        victim_user: cyrano
        staging_host: staging-server
        c2_host: c2-server
        c2_port: 6060

- name: Deploy dropped RAT persistence on victim
  hosts: victim
  become: yes
  roles:
    - role: dropped-rat
      vars:
        victim_user: cyrano
        c2_host: c2-server
        c2_port: 6060
        rat_schedule: "*:0/5"


- name: set up command logging
  hosts: hosts
  become: yes
  roles:
    - role: sandbox-logging
      slf_destination_port: '{% if hostvars["man"] is defined -%} 514 {%- else -%} 515 {%- endif %}'
