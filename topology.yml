name: sofacy

hosts:
  - name: c2-server
    base_box:
      image: ubuntu-noble-x86_64
      man_user: ubuntu
    flavor: m1.tiny

  - name: target
    base_box:
      image: ubuntu-noble-x86_64
      man_user: ubuntu
    flavor: m1.tiny

  - name: next-target
    base_box:
      image: ubuntu-noble-x86_64
      man_user: ubuntu
    flavor: m1.tiny

routers:
  - name: router
    base_box:
      image: debian-12-x86_64
      man_user: debian
    flavor: m1.tiny

networks:
  - name: server-switch
    cidr: 192.168.40.0/24
    accessible_by_user: False

  - name: target-switch
    cidr: 192.168.50.0/24

net_mappings:
  - host: c2-server
    network: server-switch
    ip: 192.168.40.5

  - host: target
    network: target-switch
    ip: 192.168.50.5

  - host: next-target
    network: target-switch
    ip: 192.168.50.6

router_mappings:
  - router: router
    network: server-switch
    ip: 192.168.40.1
  - router: router
    network: target-switch
    ip: 192.168.50.1

groups: []
